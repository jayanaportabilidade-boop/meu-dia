  var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(D.s),iterations:D.n,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);

  if(saved){ try{ show(await open_(saved)); return; }catch(e){} }
  var f=document.getElementById("f"); f.hidden=false; document.getElementById("pw").focus();
  f.addEventListener("submit",async function(e){ e.preventDefault(); var pw=document.getElementById("pw").value.trim(); document.getElementById("err").textContent="Abrindo…";
    try{ var h=await open_(pw); try{localStorage.setItem("md.pass",pw)}catch(e){} show(h); }catch(e){ document.getElementById("err").textContent="Senha incorreta."; } });
})();
</script></body></html>
